name: Qt Runtime Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: aura-ui-qt.exe
            qt_platform: windows
          - os: ubuntu-22.04
            platform: linux-x64
            binary: aura-ui-qt
            qt_platform: offscreen
          - os: macos-15
            platform: macos-x64
            binary: aura-ui-qt
            qt_platform: cocoa
          - os: macos-14
            platform: macos-arm64
            binary: aura-ui-qt
            qt_platform: cocoa

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify stdio session on the host runner
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: python scripts/smoke_stdio.py --binary build/${{ matrix.binary }} --timeout 40

      - name: Package npl archive
        run: >
          python scripts/package_npl.py
          --platform ${{ matrix.platform }}
          --binary build/${{ matrix.binary }}
          --output dist/dev.aura.ui-qt.${{ matrix.platform }}.npl

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev.aura.ui-qt.${{ matrix.platform }}
          path: |
            dist/dev.aura.ui-qt.${{ matrix.platform }}.npl
            dist/dev.aura.ui-qt.${{ matrix.platform }}.npl.sha256
          if-no-files-found: error

  checksums:
    name: Aggregate SHA-256 manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksum manifest
        working-directory: dist
        run: cat *.npl.sha256 > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish tagged packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.npl
            dist/*.sha256
            dist/SHA256SUMS.txt
          generate_release_notes: true
